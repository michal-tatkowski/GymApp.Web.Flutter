# App icon. Source PNGs come from tool/render_icon.dart.
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#EF6C00"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/foreground.png # Android 13 themed icons
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#EF6C00"
    theme_color: "#EF6C00"
