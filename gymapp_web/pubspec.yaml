name: gymapp_web
description: "GymApp — mobile app for gym & social features."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: 3.4.3

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: 18.1.1

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.2

  # Logging
  logger: ^2.4.0

  # Utils
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  # 23.x needs Android Gradle Plugin 9.1 (androidx.core 1.19); move up together with AGP 9.
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
